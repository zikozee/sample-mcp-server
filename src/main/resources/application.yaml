spring:
  application:
    name: sample-mcp-server

  datasource:
    url: jdbc:postgresql://localhost:5432/boardgamedb
    username: myuser
    password: secret

  sql:
    init:
      mode: always

  ai:
    mcp:
      server:
        # this should be SYNC (which is default) if you are not using webflux
        type: ASYNC
        capabilities:
          prompt: true


